[project]
name = "pdfchat"
version = "0.1.0"
description = "Agentic chat with PDFs of varying size and quality (Chainlit + OpenAI)"
requires-python = ">=3.13"
dependencies = [
    "chainlit>=2.12.0",
    "numpy>=2.5.4",
    "openai>=3.50.0",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# A Chainlit dependency (traceloop) uses deprecated pydantic config; not ours to fix.
filterwarnings = ["ignore:Support for class-based `config` is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdfchat"]
